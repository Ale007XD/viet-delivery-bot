# Wildcard TLS cert required (*.nanovm.space) — DNS-01 challenge, not HTTP-01,
# obtained separately (certbot --dns-<provider> ...). This file only consumes it.
#
# DNS: one A-record per active tenant subdomain -> this VPS IP
# (or a single wildcard A-record if you'd rather not touch DNS per tenant).

server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9-]+)\.nanovm\.space$;

    # ACME DNS-01 doesn't need this location, kept only if you ever fall back
    # to HTTP-01 for a single non-wildcard host.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ~^(?<tenant>[a-z0-9-]+)\.nanovm\.space$;

    ssl_certificate     /etc/nginx/ssl/nanovm.space-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/nanovm.space-privkey.pem;

    # Telegram webhook per tenant bot. bot_slug in the path lets one tenant
    # run more than one bot later without a schema change.
    location ~ ^/webhooks/telegram/(?<bot_slug>[a-z0-9_-]+)$ {
        proxy_pass http://app:8000/webhooks/telegram/$bot_slug;
        proxy_set_header X-Tenant-Slug $tenant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # YooKassa webhook — IP-allowlist mirrors the Sieshka pattern
    # (CONSTRAINTS.md: YooKassa has no HMAC signature, IP-allowlist is the
    # only mitigation). Replace with real YooKassa ranges before going live.
    location /webhooks/yookassa {
        # allow 185.71.76.0/27;
        # allow 185.71.77.0/27;
        # allow 77.75.153.0/25;
        # allow 77.75.156.11;
        # allow 77.75.156.35;
        # allow 77.75.154.128/25;
        # allow 2a02:5180::/32;
        # deny all;
        proxy_pass http://app:8000/webhooks/yookassa;
        proxy_set_header X-Tenant-Slug $tenant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header X-Tenant-Slug $tenant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
